<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4 text-center">My Profile</h1>

        <form (ngSubmit)="saveProfile()">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              class="form-control"
              [(ngModel)]="username"
              required
            />
          </div>

          <div class="mb-3">
            <label for="birthdate" class="form-label">Birthdate</label>
            <input
              id="birthdate"
              name="birthdate"
              type="date"
              class="form-control"
              [(ngModel)]="birthdate"
              required
            />
          </div>

          <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input
              id="age"
              name="age"
              type="number"
              class="form-control"
              [(ngModel)]="age"
              required
            />
          </div>

          <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              class="form-control"
              [(ngModel)]="email"
              required
            />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Save Profile</button>
          </div>
        </form>

        @if (successMessage) {
          <div class="alert alert-success mt-3 mb-0 text-center" role="alert">
            {{ successMessage }}
          </div>
        }
      </div>
    </div>
  </div>
</div>
