<div class="row justify-content-center">
	<div class="col-12 col-md-6 col-lg-5">
		<div class="card">
			<div class="card-body">
				<h1 class="h3 mb-3">Login</h1>

				<form (ngSubmit)="login()">
					<div class="mb-3">
						<label for="email" class="form-label">Email</label>
						<input
							id="email"
							name="email"
							type="email"
							class="form-control"
							[(ngModel)]="email"
							required
						/>
					</div>

					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<input
							id="password"
							name="password"
							type="password"
							class="form-control"
							[(ngModel)]="password"
							required
						/>
					</div>

					<button type="submit" class="btn btn-primary">Login</button>
				</form>
			</div>
		</div>
	</div>
</div>
