<div class="row">
	<div class="col-sm-9 col-md-7 col-lg-5 mx-auto">
		<div class="card border-primary my-5">
			<div class="card-body">
				<h1 class="card-title">Workshop 5</h1>
				<h2 class="h4">Login</h2>

				<form (ngSubmit)="login()">
					<div class="mb-3">
						<label for="email" class="form-label">Email</label>
						<input
							id="email"
							name="email"
							type="email"
							class="form-control"
							[(ngModel)]="email"
							required
						/>
					</div>

					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<input
							id="password"
							name="password"
							type="password"
							class="form-control"
							[(ngModel)]="password"
							required
						/>
					</div>

					<button type="submit" class="btn btn-primary">Login</button>

					@if (errorMessage) {
						<div class="alert alert-danger mt-3 mb-0" role="alert">
							{{ errorMessage }}
						</div>
					}
				</form>
			</div>
		</div>
	</div>
</div>
